name: Public site monitor

on:
  workflow_run:
    workflows: [Public website]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: public-site-monitor-issues
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Reconcile completed website run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/public_site_alerts.py
