name: Public website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/site-build.yml
    with:
      profile: source
  synthetic-content:
    strategy:
      fail-fast: false
      matrix:
        omit: [none, weekly, us, asia]
    uses: ./.github/workflows/site-build.yml
    with:
      profile: content
      synthetic: true
      synthetic_omit: ${{ matrix.omit }}
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CONTENT_PUBLICATION_MODE != 'artifact-v1'
    needs: [build, synthetic-content]
    runs-on: ubuntu-latest
    concurrency:
      group: quant-intel-pages-production
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
